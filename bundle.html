        <p data-i="lead.p2"></p>
        <div class="code"><span id="codeTxt">HELLO20</span><button id="copyCode" data-i="lead.copy"></button></div>
        <button class="btn btn--primary" data-close-modal data-i="lead.start"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="locModal" role="dialog" aria-modal="true" data-i-al="a.locale">
  <div class="modal__bg" data-close-modal></div>
  <div class="modal__box loc">
    <button class="modal__x" data-close-modal data-i-al="lead.close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
    <h3 data-i="loc.title"></h3>
    <label for="locSearch" data-i="loc.country"></label>
    <input type="search" id="locSearch" data-i-ph="loc.search">
    <div class="loc__list" id="locList"></div>
    <label data-i="loc.lang"></label>
    <div class="lang" id="langList"></div>
    <button class="btn btn--primary btn--block" id="locSave" data-i="loc.update"></button>
  </div>
</div>

<div class="modal" id="reviewModal" role="dialog" aria-modal="true" data-i-al="rv.write">
  <div class="modal__bg" data-close-modal></div>
  <form class="modal__box rform" id="rForm" novalidate>
    <button type="button" class="modal__x" data-close-modal data-i-al="lead.close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
    <h3 id="rfTitle"></h3>
    <p style="font-size:14px;color:var(--muted)" data-i="rf.sub"></p>
    <div id="rfStarsWrap"><label data-i="rf.rating"></label><div class="star-input" id="rfStars"></div></div>
    <label for="rfName" data-i="rf.name"></label><input id="rfName" required>
    <div id="rfTitleWrap"><label for="rfHead" data-i="rf.head"></label><input id="rfHead"></div>
    <label for="rfBody" id="rfBodyLbl"></label><textarea id="rfBody" required></textarea>
    <button class="btn btn--primary" data-i="rf.submit"></button>
  </form>
</div>

<div class="modal" id="offerModal" role="dialog" aria-modal="true" data-i-al="a.offer">
  <div class="modal__bg" data-close-modal></div>
  <div class="modal__box offer">
    <button class="modal__x" data-close-modal data-i-al="lead.close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
    <h3 data-i="offer.title"></h3>
    <ul id="offerList"></ul>
    <p data-i="offer.note"></p>
  </div>
</div>

<!-- ================= LIGHTBOX ================= -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox__x" data-close-lightbox data-i-al="lead.close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
  <div class="lightbox__list" id="lbList"></div>
</div>

<!-- ================= FLOATING UI ================= -->
<button class="cookie-fab" id="cookieFab" data-open="cookieModal" data-i-al="a.cookie"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3a11 11 0 1011 11 4 4 0 01-4.5-4A4 4 0 0116 5.5 4 4 0 0114 3z"/><circle cx="10" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="18" r="1.2" fill="currentColor"/><circle cx="9" cy="18" r="1" fill="currentColor"/></svg></button>
<button class="lead-pill" id="leadPill" data-i-al="lead.pill"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8.6 1.5H14v5.4L7 14 1.9 8.9z"/><circle cx="11.4" cy="4.2" r="1.1" fill="#212121"/></svg><span class="lbl" data-i="lead.pill"></span></button>
<div class="mascot" id="mascot">
  <div class="bubble" id="bubble" role="dialog">
    <b data-i="pip.hi"></b><span data-i="pip.pick"></span>
    <div class="flavors" id="flavors"></div>
    <button class="hide" id="hideMascot" data-i="pip.hide"></button>
  </div>
  <button class="mascot__btn" id="mascotBtn" data-i-al="pip.open" data-mascot></button>
</div>
<div class="buddy" id="buddy" aria-hidden="true"><span class="buddy__fig" id="buddyFig"></span></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/site.js"></script>
</body>
</html>
