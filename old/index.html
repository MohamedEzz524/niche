<!-- ================= SEARCH ================= -->
<div class="scrim scrim--search" id="searchScrim"></div>
<div class="search" id="search" role="dialog" aria-modal="true" data-i-al="nav.search" aria-hidden="true">
  <form class="search__row" id="searchForm" role="search">
    <div class="search__field">
      <label for="searchInput" data-i="nav.search"></label>
      <input id="searchInput" type="search" autocomplete="off" aria-controls="suggest">
      <button type="button" class="search__clear" id="searchClear" data-i-al="a.clear" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="6.5"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"/></svg></button><span class="search__sep"></span>
      <button class="search__go" data-i-al="nav.search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></button>
    </div>
    <button type="button" class="search__x" data-close-search data-i-al="a.closeSearch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
  </form>
  <div class="suggest" id="suggest" hidden></div>
  <h6 data-i="search.popular"></h6>
  <div class="pills" id="pills"></div>
  <div class="search__peek" aria-hidden="true"><span style="--i:0" data-peek="berry"></span><span style="--i:1" data-peek="honey"></span><span style="--i:2" data-peek="marsh"></span></div>

<!-- ================= MODALS ================= -->
<div class="modal" id="cookieModal" role="dialog" aria-modal="true" data-i-al="cookie.title">
  <div class="modal__bg"></div>
  <div class="modal__box cookie">
    <div class="cookie__h"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3a11 11 0 1011 11 4 4 0 01-4.5-4A4 4 0 0116 5.5 4 4 0 0114 3z"/><circle cx="10" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="18" r="1.2" fill="currentColor"/><circle cx="9" cy="18" r="1" fill="currentColor"/><circle cx="19" cy="14" r="1" fill="currentColor"/></svg><span data-i="cookie.title"></span></div>
    <div id="cookieMain">
      <p data-i="cookie.text"></p>
      <button class="btn btn--primary" data-cookie="accept" data-i="cookie.accept"></button>
      <button class="btn btn--primary" data-cookie="decline" data-i="cookie.decline"></button>
      <button class="btn btn--outline" data-cookie="prefs" data-i="cookie.prefs"></button>
    </div>
    <div id="cookiePrefs" hidden>
      <div class="prefs">
        <div class="pref"><span data-i="cookie.nec"></span><label class="switch"><input type="checkbox" checked disabled><span></span></label></div>
        <div class="pref"><span data-i="cookie.ana"></span><label class="switch"><input type="checkbox" id="ckA"><span></span></label></div>
        <div class="pref"><span data-i="cookie.mkt"></span><label class="switch"><input type="checkbox" id="ckM"><span></span></label></div>
      </div>
      <button class="btn btn--primary" data-cookie="save" data-i="cookie.save"></button>
      <button class="btn btn--outline" data-cookie="back" data-i="mega.back"></button>
    </div>
  </div>
</div>

<div class="modal" id="leadModal" role="dialog" aria-modal="true" data-i-al="lead.pill">
  <div class="modal__bg" data-close-modal></div>
  <div class="modal__box lead">
    <div class="lead__art"><div class="lead__cap"><b data-i="coll.1"></b><span data-i="lead.cap"></span></div><img class="art" src="assets/gallery/lead-model.webp" alt="" loading="lazy" style="object-position:center 30%"></div>
    <div class="lead__form">
      <button class="close-txt" data-close-modal data-i="lead.close"></button>
      <div class="lead__step" id="leadStep1">
        <h4 data-i="lead.hi"></h4>
        <h2 data-i="lead.h"></h2>
        <p data-i="lead.p"></p>
        <form id="leadForm" novalidate><input type="email" id="leadEmail" data-i-ph="lead.ph" data-i-al="f.email">
        <p class="lead__fine" data-i="lead.fine"></p>
        <button class="btn btn--primary" data-i="lead.next"></button></form>
        <button class="lead__no" data-close-modal data-i="lead.no"></button>
      </div>
      <div class="lead__step" id="leadStep2" hidden>
        <h4 data-i="lead.in"></h4>
        <h2 data-i="lead.h2"></h2>
        <p data-i="lead.p2"></p>
        <div class="code"><span id="codeTxt">HELLO20</span><button id="copyCode" data-i="lead.copy"></button></div>
        <button class="btn btn--primary" data-close-modal data-i="lead.start"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="locModal" role="dialog" aria-modal="true" data-i-al="a.locale">

    <button class="btn btn--primary btn--block" id="locSave" data-i="loc.update"></button>
  </div>
</div>

<div class="modal" id="reviewModal" role="dialog" aria-modal="true" data-i-al="rv.write">
  <div class="modal__bg" data-close-modal></div>
  <form class="modal__box rform" id="rForm" novalidate>
    <button type="button" class="modal__x" data-close-modal data-i-al="lead.close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
    <h3 id="rfTitle"></h3>
    <p style="font-size:14px;color:var(--muted)" data-i="rf.sub"></p>
    <div id="rfStarsWrap"><label data-i="rf.rating"></label><div class="star-input" id="rfStars"></div></div>
    <label for="rfName" data-i="rf.name"></label><input id="rfName" required>
    <div id="rfTitleWrap"><label for="rfHead" data-i="rf.head"></label><input id="rfHead"></div>
    <label for="rfBody" id="rfBodyLbl"></label><textarea id="rfBody" required></textarea>
    <button class="btn btn--primary" data-i="rf.submit"></button>
  </form>
</div>

<div class="modal" id="offerModal" role="dialog" aria-modal="true" data-i-al="a.offer">

    <button class="hide" id="hideMascot" data-i="pip.hide"></button>
